<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset your password — CalCut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F5F5F5;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .wordmark {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 32px;
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    .wordmark .cal { color: #1A1A1A; }
    .wordmark .cut { color: #FF5C00; }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 28px;
      line-height: 1.2;
      color: #1A1A1A;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 16px;
      line-height: 1.5;
      color: #888888;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: #1A1A1A;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input[type="password"] {
      width: 100%;
      padding: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: #1A1A1A;
      background: #FFFFFF;
      border: 1.5px solid #E5E5E5;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type="password"]:focus { border-color: #FF5C00; }
    button {
      width: 100%;
      padding: 18px;
      margin-top: 28px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #FFFFFF;
      background-color: #FF5C00;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.15s, background-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { opacity: 0.92; }
    button:active { opacity: 0.85; }
    button:disabled {
      background-color: #CCCCCC;
      cursor: not-allowed;
      opacity: 1;
    }
    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      min-height: 20px;
    }
    .message.error { color: #E53935; }
    .message.success { color: #4CAF50; }
    .success-state { text-align: center; padding: 16px 0; }
    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 32px;
    }
    .success-state h1 { margin-bottom: 16px; }
    .success-state p {
      font-size: 16px;
      line-height: 1.5;
      color: #888888;
      margin-bottom: 8px;
    }
    .hidden { display: none; }
    .password-hint {
      font-size: 13px;
      color: #888888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="cal">Cal</span><span class="cut">Cut</span></div>

    <div id="form-state">
      <h1>Reset your password</h1>
      <p class="subtitle">Enter a new password for your CalCut account.</p>

      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters">

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter password">

      <button id="submit-btn" onclick="updatePassword()">Update password</button>

      <div class="message" id="message"></div>
    </div>

    <div id="success-state" class="success-state hidden">
      <div class="success-icon">✓</div>
      <h1>Password updated</h1>
      <p>You're all set.</p>
      <p>Open the CalCut app and log in with your new password.</p>
    </div>

    <div id="invalid-state" class="success-state hidden">
      <h1>Link expired</h1>
      <p>This password reset link is invalid or has expired.</p>
      <p>Open the CalCut app and request a new one.</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://bodewohasqeehdwkpqen.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZGV3b2hhc3FlZWhkd2twcWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDUyNDMsImV4cCI6MjA5MTEyMTI0M30.vYwZzv8LZnd0xSdALYM-ESPtL9DFs_g0_d5bIlwYJAo';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'implicit' }
    });

    // Check on load whether we have a valid recovery session
    window.addEventListener('load', async () => {
      // Supabase auto-parses the URL hash and sets the session
      // Give it a moment, then check
      setTimeout(async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          document.getElementById('form-state').classList.add('hidden');
          document.getElementById('invalid-state').classList.remove('hidden');
        }
      }, 300);
    });

    window.updatePassword = async function() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const messageEl = document.getElementById('message');
      const btn = document.getElementById('submit-btn');

      messageEl.textContent = '';
      messageEl.className = 'message';

      if (!password || password.length < 6) {
        messageEl.textContent = 'Password must be at least 6 characters.';
        messageEl.classList.add('error');
        return;
      }
      if (password !== confirm) {
        messageEl.textContent = 'Passwords don\'t match.';
        messageEl.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Update password';
        messageEl.textContent = error.message || 'Something went wrong. Try requesting a new reset link.';
        messageEl.classList.add('error');
        return;
      }

      // Sign out to clear the recovery session
      await supabase.auth.signOut();

      document.getElementById('form-state').classList.add('hidden');
      document.getElementById('success-state').classList.remove('hidden');
    };
  </script>
</body>
</html>
